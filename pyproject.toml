[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "umami-report"
version = "0.1.0"
description = "Weekly Umami analytics report sent to Discord."
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.30",
    "venvalid>=0.3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
